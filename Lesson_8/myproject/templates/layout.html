<!DOCTYPE html>
{% load static  %} <!-- load = loads the static files, which are css and js files in this case -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %} <!-- block = placeholder for the title of the page, which will be replaced by the child template -->
            Django App
        {% endblock %} 
    </title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}"> <!-- static = loads the css file from the static folder -->
    <script src = " {% static 'js/main.js' %}" defer></script> <!-- defer = wait until all pages are loaded then loads the script -->
</head>
<body>  
    <nav>
        <a href="/">
          <span role = "img" aria-label="Home">🏠</span>
        </a> |        
        <a href="/about">
            <span role="img" aria-label="Smile">😊</span>
        </a> |        
        <a href="{% url 'posts:list' %}">
            <span role="img" aria-label="Posts">📰</span>
        </a> |
        
        {% if user.is_authenticated %}
            <a href="{% url 'posts:new-post' %}">
                <span role="img" aria-label="New Post" title='New Post' >🆕</span>
            </a> |
            <form class='logout' action="{% url 'users:logout' %}" method='post'>
                {% csrf_token %}
                <button class="logout-button" aria-label='User Logout' title='User logout'>👋</button>
            </form>
        {% else %}
            <a href="{% url 'users:register' %}">
                <span role="img" aria-label="Register">🚀</span>
            </a> |
            <a href="{% url 'users:login' %}">
                <span role="img" aria-label="User Login">🔒</span>
            </a>
        {% endif %}
    </nav>
    <main>
        {%  block content  %}
        {% endblock %}
    </main>
</body>
</html>
